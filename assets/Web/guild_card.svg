<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e6c4"/>
      <stop offset="100%" stop-color="#e3cd9a"/>
    </linearGradient>
    <radialGradient id="seal" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#9a2c2c"/>
      <stop offset="100%" stop-color="#6e1c1c"/>
    </radialGradient>
  </defs>

  <!-- card body -->
  <rect x="8" y="8" width="524" height="324" rx="22" fill="url(#parchment)" stroke="#5a3a1f" stroke-width="4"/>
  <rect x="18" y="18" width="504" height="304" rx="16" fill="none" stroke="#8a6a3f" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- header: emblem + title -->
  <g transform="translate(38,28)">
    <!-- shield emblem -->
    <path d="M14 0 L28 6 V22 C28 34 20 42 14 46 C8 42 0 34 0 22 V6 Z"
          fill="#5a3a1f" stroke="#3c260f" stroke-width="1.5"/>
    <path d="M14 6 L22 10 V22 C22 30 18 35 14 38 C10 35 6 30 6 22 V10 Z"
          fill="#e3cd9a"/>
    <path d="M14 12 L14 30 M8 18 L20 18" stroke="#5a3a1f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="245" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a2f16" letter-spacing="0.5">ADVENTURERS' GUILD</text>
  <text x="245" y="64" text-anchor="middle" font-size="10" fill="#7a5a35" letter-spacing="2.5">MEMBER IDENTIFICATION CARD</text>

  <!-- party affiliation: top-right, level with the emblem -->
  <text x="505" y="32" text-anchor="end" font-size="9" fill="#7a5a35" letter-spacing="2">PARTY</text>
  <text x="505" y="49" text-anchor="end" font-size="11.5" font-weight="bold" fill="#4a2f16">The Ashen Vanguard</text>

  <line x1="30" y1="82" x2="510" y2="82" stroke="#8a6a3f" stroke-width="1.5"/>

  <!-- portrait box -->
  <rect x="38" y="100" width="112" height="140" rx="6" fill="#d9c79f" stroke="#5a3a1f" stroke-width="3"/>
  <circle cx="94" cy="144" r="24" fill="#8a6a45"/>
  <path d="M56 230 C56 194 132 194 132 230 Z" fill="#8a6a45"/>
  <text x="94" y="254" text-anchor="middle" font-size="10" fill="#6a4a25" letter-spacing="1">PORTRAIT</text>

  <!-- text fields -->
  <g font-size="14" fill="#3c2810">
    <text x="168" y="122"><tspan font-weight="bold">NAME:</tspan> Elira Duskwind</text>
    <text x="168" y="146"><tspan font-weight="bold">CARD NO:</tspan> AG-014522</text>
    <text x="168" y="170"><tspan font-weight="bold">REGISTERED:</tspan> 14th of Solmonth</text>
    <text x="168" y="194"><tspan font-weight="bold">BRANCH:</tspan> Millbrook Branch</text>
    <text x="168" y="218"><tspan font-weight="bold">DESIGNATION:</tspan> Mage</text>
  </g>

  <!-- special designations: earned title/skill tag chips -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="168" y="234" width="82" height="21" rx="10.5" fill="#c9b183" stroke="#5a3a1f" stroke-width="1.2"/>
    <text x="209" y="248.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#3c2810">TRACKER</text>
    <rect x="258" y="234" width="132" height="21" rx="10.5" fill="#c9b183" stroke="#5a3a1f" stroke-width="1.2"/>
    <text x="324" y="248.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#3c2810">DRAGON SLAYER</text>
  </g>

  <!-- rank badge (color reuses rank.md's C Rank Visual Color: Green) -->
  <circle cx="465" cy="150" r="46" fill="#2f8f42" stroke="#1f5c2c" stroke-width="4"/>
  <circle cx="465" cy="150" r="38" fill="none" stroke="#e3cd9a" stroke-width="1.5"/>
  <text x="465" y="165" text-anchor="middle" font-size="46" font-weight="bold" fill="#f3e6c4">C</text>
  <text x="465" y="206" text-anchor="middle" font-size="12" fill="#4a2f16" letter-spacing="2">RANK</text>

  <!-- guild seal (wax seal style, anti-forgery sigil) -->
  <g transform="translate(465,272)">
    <circle r="30" fill="url(#seal)" stroke="#4a1414" stroke-width="2"/>
    <g fill="none" stroke="#d4af37" stroke-width="2" stroke-linejoin="round">
      <polygon points="0,-16 4.7,-5 16,-5 6.8,2 10,13 0,6 -10,13 -6.8,2 -16,-5 -4.7,-5"/>
    </g>
    <circle r="30" fill="none" stroke="#4a1414" stroke-width="1" stroke-dasharray="1.5 3"/>
  </g>
  <text x="465" y="313" text-anchor="middle" font-size="9" fill="#6a4a25" letter-spacing="1">GUILD SEAL</text>

  <!-- footer -->
  <text x="230" y="316" text-anchor="middle" font-size="9" font-style="italic" fill="#7a5a35">
    Property of the Adventurers' Guild — not transferable
  </text>
</svg>
