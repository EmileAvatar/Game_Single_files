<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="panelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a341c"/>
      <stop offset="100%" stop-color="#2a1c0f"/>
    </linearGradient>
    <linearGradient id="buttonWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6226"/>
      <stop offset="100%" stop-color="#5a3a14"/>
    </linearGradient>
  </defs>

  <!-- dimmed world backdrop -->
  <rect x="0" y="0" width="960" height="600" fill="#14100b"/>

  <!-- main panel -->
  <rect x="60" y="40" width="840" height="520" rx="14" fill="url(#panelWood)" stroke="#c9a227" stroke-width="4"/>
  <rect x="72" y="52" width="816" height="496" rx="10" fill="none" stroke="#8a6a3f" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- header -->
  <text x="96" y="88" font-size="24" font-weight="bold" fill="#f0dfa8" letter-spacing="0.5">CRAFTING STATION</text>
  <text x="96" y="108" font-size="12" fill="#c9b183" letter-spacing="1.5">TYPE: FORGE · REQUIRED SKILL 0</text>
  <circle cx="866" cy="80" r="14" fill="#3a2812" stroke="#c9a227" stroke-width="2"/>
  <text x="866" y="85" text-anchor="middle" font-size="14" fill="#e8dcc0">✕</text>
  <line x1="90" y1="120" x2="870" y2="120" stroke="#8a6a3f" stroke-width="1.5"/>

  <!-- left column: recipe category tabs + list -->
  <g>
    <rect x="90" y="136" width="52" height="24" rx="4" fill="#6e4a1f" stroke="#c9a227" stroke-width="1"/>
    <text x="116" y="152" text-anchor="middle" font-size="10" fill="#f0dfa8">All</text>
    <rect x="146" y="136" width="70" height="24" rx="4" fill="#241a10" stroke="#8a6a3f" stroke-width="1"/>
    <text x="181" y="152" text-anchor="middle" font-size="10" fill="#c9b183">Weapons</text>
    <rect x="220" y="136" width="60" height="24" rx="4" fill="#241a10" stroke="#8a6a3f" stroke-width="1"/>
    <text x="250" y="152" text-anchor="middle" font-size="10" fill="#c9b183">Armor</text>

    <rect x="90" y="168" width="200" height="330" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="100" y="188" font-size="11" fill="#9c8a68" letter-spacing="1">RECIPES</text>
    <g font-size="12" fill="#e8dcc0">
      <rect x="98" y="198" width="184" height="26" rx="4" fill="#5a3a14" stroke="#c9a227" stroke-width="1"/>
      <text x="106" y="215">Iron Sword</text>
      <text x="108" y="234">Iron Dagger</text>
      <text x="108" y="258">Steel Longsword</text>
      <text x="108" y="282">War Hammer</text>
      <text x="108" y="306">Chainmail</text>
      <text x="108" y="330">Masterwork Blade</text>
    </g>
    <text x="100" y="480" font-size="9" fill="#7a6a50">Filter · Sort by name/value/skill</text>
  </g>

  <!-- center column: selected recipe details -->
  <g>
    <rect x="308" y="136" width="330" height="362" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="322" y="160" font-size="15" font-weight="bold" fill="#f0dfa8">Iron Sword</text>
    <text x="322" y="178" font-size="10" fill="#9c8a68" letter-spacing="1">REQUIRED MATERIALS</text>

    <g font-size="11" fill="#e8dcc0">
      <text x="322" y="200">Iron Ingot</text>
      <text x="590" y="200" text-anchor="end" fill="#6fae6f">2 / 2 ✓</text>
      <text x="322" y="222">Wood Plank</text>
      <text x="590" y="222" text-anchor="end" fill="#6fae6f">1 / 1 ✓</text>
      <text x="322" y="244">Leather</text>
      <text x="590" y="244" text-anchor="end" fill="#c96a5a">0 / 1 ✗</text>
    </g>
    <line x1="322" y1="256" x2="622" y2="256" stroke="#8a6a3f" stroke-width="1"/>

    <text x="322" y="278" font-size="11" fill="#c9b183">Required Skill: 0</text>
    <text x="322" y="298" font-size="11" fill="#c9b183">Craft Time: 30 minutes</text>

    <text x="322" y="322" font-size="11" fill="#c9b183">Success Chance</text>
    <rect x="322" y="330" width="300" height="14" rx="7" fill="#1a1209"/>
    <rect x="322" y="330" width="270" height="14" rx="7" fill="#3f8f4a"/>
    <text x="622" y="341" text-anchor="end" font-size="10" fill="#e8dcc0">90%</text>

    <text x="322" y="366" font-size="10" fill="#9c8a68" letter-spacing="1">POSSIBLE QUALITY OUTCOMES</text>
    <g font-size="9" font-weight="bold">
      <rect x="322" y="374" width="62" height="20" rx="10" fill="#5a5a5a"/>
      <text x="353" y="388" text-anchor="middle" fill="#fff">NORMAL</text>
      <rect x="390" y="374" width="46" height="20" rx="10" fill="#2f8f42"/>
      <text x="413" y="388" text-anchor="middle" fill="#fff">FINE</text>
      <rect x="442" y="374" width="72" height="20" rx="10" fill="#2f6fbf"/>
      <text x="478" y="388" text-anchor="middle" fill="#fff">SUPERIOR</text>
      <rect x="520" y="374" width="102" height="20" rx="10" fill="#7a3fbf"/>
      <text x="571" y="388" text-anchor="middle" fill="#fff">MASTERWORK</text>
    </g>

    <text x="322" y="420" font-size="10" fill="#9c8a68" letter-spacing="1">STATION DURABILITY</text>
    <rect x="322" y="428" width="300" height="10" rx="5" fill="#1a1209"/>
    <rect x="322" y="428" width="255" height="10" rx="5" fill="#c9a227"/>
    <text x="322" y="452" font-size="10" fill="#c9b183">Fuel: Coal — 1 per hour</text>
    <rect x="322" y="460" width="16" height="16" fill="#3a2812" stroke="#8a6a3f"/>
    <rect x="342" y="460" width="16" height="16" fill="#3a2812" stroke="#8a6a3f"/>
    <rect x="362" y="460" width="16" height="16" fill="#241a10" stroke="#8a6a3f" stroke-dasharray="2 2"/>
  </g>

  <!-- right column: material slots + output + craft -->
  <g>
    <rect x="656" y="136" width="184" height="362" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="670" y="158" font-size="10" fill="#9c8a68" letter-spacing="1">MATERIAL SLOTS</text>
    <g>
      <rect x="670" y="168" width="46" height="46" rx="4" fill="#3a2812" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="693" y="195" text-anchor="middle" font-size="9" fill="#c9b183">IRON</text>
      <rect x="726" y="168" width="46" height="46" rx="4" fill="#3a2812" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="749" y="195" text-anchor="middle" font-size="9" fill="#c9b183">WOOD</text>
      <rect x="670" y="222" width="46" height="46" rx="4" fill="#241a10" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="693" y="249" text-anchor="middle" font-size="8" fill="#7a6a50">EMPTY</text>
    </g>

    <text x="670" y="296" font-size="10" fill="#9c8a68" letter-spacing="1">OUTPUT</text>
    <rect x="670" y="304" width="102" height="70" rx="6" fill="#3a2812" stroke="#c9a227" stroke-width="2"/>
    <text x="721" y="343" text-anchor="middle" font-size="10" fill="#f0dfa8">Iron Sword</text>

    <rect x="670" y="398" width="150" height="34" rx="6" fill="url(#buttonWood)" stroke="#e9d9a8" stroke-width="1.5"/>
    <text x="745" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">CRAFT</text>

    <text x="670" y="452" font-size="9" fill="#9c8a68" letter-spacing="1">CRAFT MULTIPLE</text>
    <g font-size="9" fill="#e8dcc0">
      <rect x="670" y="460" width="30" height="20" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="685" y="474" text-anchor="middle">1x</text>
      <rect x="704" y="460" width="30" height="20" rx="4" fill="#241a10" stroke="#8a6a3f"/>
      <text x="719" y="474" text-anchor="middle">5x</text>
      <rect x="738" y="460" width="34" height="20" rx="4" fill="#241a10" stroke="#8a6a3f"/>
      <text x="755" y="474" text-anchor="middle">10x</text>
      <rect x="776" y="460" width="34" height="20" rx="4" fill="#241a10" stroke="#8a6a3f"/>
      <text x="793" y="474" text-anchor="middle">All</text>
    </g>
  </g>

  <text x="96" y="538" font-size="9" fill="#7a6a50">Reference mockup only — see UI.md &quot;Crafting Interfaces &gt; Crafting Station Interface&quot; and crafting.md for full field definitions.</text>
</svg>
