<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="panelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a341c"/>
      <stop offset="100%" stop-color="#2a1c0f"/>
    </linearGradient>
    <linearGradient id="buttonWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6226"/>
      <stop offset="100%" stop-color="#5a3a14"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8622a"/>
      <stop offset="100%" stop-color="#7a2a10"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#14100b"/>
  <rect x="60" y="40" width="840" height="520" rx="14" fill="url(#panelWood)" stroke="#c9a227" stroke-width="4"/>
  <rect x="72" y="52" width="816" height="496" rx="10" fill="none" stroke="#8a6a3f" stroke-width="1.5" stroke-dasharray="2 4"/>

  <text x="96" y="88" font-size="24" font-weight="bold" fill="#f0dfa8">FORGE — SMITHING</text>
  <text x="96" y="108" font-size="12" fill="#c9b183" letter-spacing="1.5">SELECTED: FORGE · REQUIRED SKILL 0</text>
  <circle cx="866" cy="80" r="14" fill="#3a2812" stroke="#c9a227" stroke-width="2"/>
  <text x="866" y="85" text-anchor="middle" font-size="14" fill="#e8dcc0">✕</text>
  <line x1="90" y1="120" x2="870" y2="120" stroke="#8a6a3f" stroke-width="1.5"/>

  <!-- station tabs -->
  <g font-size="10">
    <rect x="90" y="134" width="90" height="30" rx="5" fill="#5a3a14" stroke="#c9a227" stroke-width="1.5"/>
    <text x="135" y="150" text-anchor="middle" fill="#f0dfa8" font-weight="bold">FORGE</text>
    <text x="135" y="161" text-anchor="middle" fill="#c9b183" font-size="8">Skill 0</text>
    <rect x="186" y="134" width="90" height="30" rx="5" fill="#241a10" stroke="#8a6a3f"/>
    <text x="231" y="150" text-anchor="middle" fill="#c9b183">ANVIL</text>
    <text x="231" y="161" text-anchor="middle" fill="#7a6a50" font-size="8">Skill 0</text>
    <rect x="282" y="134" width="98" height="30" rx="5" fill="#241a10" stroke="#8a6a3f"/>
    <text x="331" y="150" text-anchor="middle" fill="#c9b183">RUNE FORGE</text>
    <text x="331" y="161" text-anchor="middle" fill="#7a6a50" font-size="8">Skill 40</text>
    <rect x="386" y="134" width="104" height="30" rx="5" fill="#241a10" stroke="#8a6a3f"/>
    <text x="438" y="150" text-anchor="middle" fill="#c9b183">HEAVY FORGE</text>
    <text x="438" y="161" text-anchor="middle" fill="#7a6a50" font-size="8">Skill 50</text>
  </g>

  <!-- forge visual + stats -->
  <g>
    <rect x="90" y="182" width="200" height="316" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <circle cx="190" cy="238" r="34" fill="url(#forgeGlow)" stroke="#3a2010" stroke-width="4"/>
    <text x="190" y="290" text-anchor="middle" font-size="9" fill="#9c8a68" letter-spacing="1">STATION STATS</text>
    <g font-size="10" fill="#e8dcc0">
      <text x="102" y="310">Base Success: 90%</text>
      <text x="102" y="328">Craft Speed: 100%</text>
      <text x="102" y="346">Max Item Tier: Uncommon</text>
      <text x="102" y="364">Fuel: Coal (1/hr)</text>
    </g>
    <text x="102" y="392" font-size="9" fill="#9c8a68" letter-spacing="1">DURABILITY</text>
    <rect x="102" y="400" width="176" height="10" rx="5" fill="#1a1209"/>
    <rect x="102" y="400" width="150" height="10" rx="5" fill="#c9a227"/>
    <text x="102" y="422" font-size="9" fill="#c9b183">862 / 1000 uses</text>
    <text x="102" y="446" font-size="9" fill="#9c8a68" letter-spacing="1">FUEL GAUGE</text>
    <rect x="102" y="454" width="176" height="10" rx="5" fill="#1a1209"/>
    <rect x="102" y="454" width="90" height="10" rx="5" fill="#e8622a"/>
  </g>

  <!-- recipe/material slots -->
  <g>
    <rect x="308" y="182" width="270" height="316" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="322" y="204" font-size="13" font-weight="bold" fill="#f0dfa8">Steel Longsword</text>
    <text x="322" y="222" font-size="10" fill="#9c8a68" letter-spacing="1">MATERIAL SLOTS</text>
    <g>
      <rect x="322" y="230" width="44" height="44" rx="4" fill="#3a2812" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="344" y="255" text-anchor="middle" font-size="8" fill="#c9b183">STEEL x3</text>
      <rect x="376" y="230" width="44" height="44" rx="4" fill="#3a2812" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="398" y="255" text-anchor="middle" font-size="8" fill="#c9b183">WOOD x1</text>
      <rect x="430" y="230" width="44" height="44" rx="4" fill="#3a2812" stroke="#8a6a3f" stroke-dasharray="2 2"/>
      <text x="452" y="255" text-anchor="middle" font-size="8" fill="#c9b183">LEATHER x2</text>
    </g>
    <text x="322" y="304" font-size="10" fill="#9c8a68" letter-spacing="1">CRAFT TIME</text>
    <text x="322" y="322" font-size="11" fill="#e8dcc0">30 minutes</text>
    <text x="322" y="346" font-size="10" fill="#9c8a68" letter-spacing="1">QUALITY PREVIEW (skill margin)</text>
    <g font-size="9" font-weight="bold">
      <rect x="322" y="354" width="62" height="20" rx="10" fill="#5a5a5a"/>
      <text x="353" y="368" text-anchor="middle" fill="#fff">NORMAL</text>
      <rect x="390" y="354" width="46" height="20" rx="10" fill="#2f8f42"/>
      <text x="413" y="368" text-anchor="middle" fill="#fff">FINE</text>
    </g>
    <text x="322" y="400" font-size="9" fill="#c9b183">Special: +15% fire-element enchant bonus (Rune Forge only)</text>
  </g>

  <!-- output + craft -->
  <g>
    <rect x="596" y="182" width="244" height="316" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="610" y="204" font-size="10" fill="#9c8a68" letter-spacing="1">OUTPUT</text>
    <rect x="610" y="212" width="110" height="76" rx="6" fill="#3a2812" stroke="#c9a227" stroke-width="2"/>
    <text x="665" y="254" text-anchor="middle" font-size="10" fill="#f0dfa8">Steel</text>
    <text x="665" y="268" text-anchor="middle" font-size="10" fill="#f0dfa8">Longsword</text>

    <text x="610" y="312" font-size="10" fill="#9c8a68" letter-spacing="1">SUCCESS CHANCE</text>
    <rect x="610" y="320" width="210" height="12" rx="6" fill="#1a1209"/>
    <rect x="610" y="320" width="185" height="12" rx="6" fill="#3f8f4a"/>
    <text x="820" y="330" text-anchor="end" font-size="9" fill="#e8dcc0">88%</text>

    <rect x="610" y="350" width="150" height="34" rx="6" fill="url(#buttonWood)" stroke="#e9d9a8" stroke-width="1.5"/>
    <text x="685" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">FORGE</text>

    <text x="610" y="410" font-size="9" fill="#9c8a68" letter-spacing="1">CRAFT MULTIPLE</text>
    <g font-size="9" fill="#e8dcc0">
      <rect x="610" y="418" width="30" height="20" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="625" y="432" text-anchor="middle">1x</text>
      <rect x="644" y="418" width="30" height="20" rx="4" fill="#241a10" stroke="#8a6a3f"/>
      <text x="659" y="432" text-anchor="middle">5x</text>
    </g>
  </g>

  <text x="96" y="538" font-size="9" fill="#7a6a50">Reference mockup only — Smithing-specific variant; see crafting.md &quot;Smithing Stations&quot; for full station stats.</text>
</svg>
