<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="panelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a341c"/>
      <stop offset="100%" stop-color="#2a1c0f"/>
    </linearGradient>
    <linearGradient id="buttonWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6226"/>
      <stop offset="100%" stop-color="#5a3a14"/>
    </linearGradient>
    <linearGradient id="vatFluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fd4a0"/>
      <stop offset="100%" stop-color="#2a6e4a"/>
    </linearGradient>
    <radialGradient id="crystalGlow" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0bfff"/>
      <stop offset="100%" stop-color="#5a2a8e"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#14100b"/>
  <rect x="60" y="40" width="840" height="520" rx="14" fill="url(#panelWood)" stroke="#c9a227" stroke-width="4"/>
  <rect x="72" y="52" width="816" height="496" rx="10" fill="none" stroke="#8a6a3f" stroke-width="1.5" stroke-dasharray="2 4"/>

  <text x="96" y="86" font-size="17" font-weight="bold" fill="#f0dfa8">BIO CREATURE CREATE — ADVANCED (VAT + POWER CONDUITS)</text>
  <text x="96" y="104" font-size="11" fill="#c9b183" letter-spacing="1.2">STATION: VITAE INCUBATOR, WIRED TO devices.md POWER SYSTEM</text>
  <circle cx="866" cy="76" r="14" fill="#3a2812" stroke="#c9a227" stroke-width="2"/>
  <text x="866" y="81" text-anchor="middle" font-size="14" fill="#e8dcc0">✕</text>
  <line x1="90" y1="114" x2="870" y2="114" stroke="#8a6a3f" stroke-width="1.5"/>

  <!-- left: part slots (condensed) -->
  <g>
    <rect x="90" y="126" width="200" height="300" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="104" y="146" font-size="9" fill="#9c8a68" letter-spacing="1">PART SLOTS</text>
    <g font-size="7" fill="#c9b183">
      <rect x="104" y="154" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="124" y="177" text-anchor="middle" fill="#f0dfa8">BRAIN</text>
      <rect x="150" y="154" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="170" y="177" text-anchor="middle" fill="#f0dfa8">EYES</text>
      <rect x="196" y="154" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="216" y="177" text-anchor="middle" fill="#f0dfa8">BODY</text>
      <rect x="242" y="154" width="36" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>

      <rect x="104" y="200" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="124" y="223" text-anchor="middle" fill="#f0dfa8">LIMBS</text>
      <rect x="150" y="200" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="170" y="223" text-anchor="middle" fill="#f0dfa8">WINGS</text>
      <rect x="196" y="200" width="40" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
      <text x="216" y="223" text-anchor="middle" fill="#f0dfa8">TAIL</text>
      <rect x="242" y="200" width="36" height="40" rx="4" fill="#5a3a14" stroke="#c9a227"/>
    </g>
    <text x="104" y="266" font-size="9" fill="#9c8a68" letter-spacing="1">TEMPLATE</text>
    <text x="104" y="284" font-size="9" fill="#e8dcc0">Advanced Chimera (Manticore, 9 parts)</text>
    <text x="104" y="308" font-size="9" fill="#9c8a68" letter-spacing="1">MUTATION RISK</text>
    <rect x="104" y="316" width="174" height="8" rx="4" fill="#1a1209"/>
    <rect x="104" y="316" width="17" height="8" rx="4" fill="#c9a227"/>
    <text x="104" y="332" font-size="8" fill="#6fae6f">10% (reduced by Incubator)</text>
    <text x="104" y="356" font-size="9" fill="#9c8a68" letter-spacing="1">STAT PREVIEW</text>
    <text x="104" y="372" font-size="8" fill="#e8dcc0">HP: 340 · Damage: 30-40</text>
    <text x="104" y="386" font-size="8" fill="#e8dcc0">Abilities: Sting, Roar, Flight</text>
    <rect x="104" y="398" width="150" height="20" rx="5" fill="url(#buttonWood)" stroke="#e9d9a8"/>
    <text x="179" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">BEGIN GROWTH</text>
  </g>

  <!-- center: vat visualization -->
  <g>
    <rect x="308" y="126" width="270" height="300" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="322" y="146" font-size="9" fill="#9c8a68" letter-spacing="1">VITAE INCUBATOR</text>
    <rect x="378" y="156" width="130" height="128" rx="16" fill="#1a1209" stroke="#8a6a3f" stroke-width="3"/>
    <rect x="386" y="206" width="114" height="70" rx="10" fill="url(#vatFluid)"/>
    <ellipse cx="443" cy="206" rx="57" ry="7" fill="#a8f0c0" opacity="0.6"/>
    <text x="443" y="246" text-anchor="middle" font-size="8" fill="#0a2a18" font-weight="bold">GROWING…</text>
    <!-- power line into the vat from below -->
    <line x1="443" y1="284" x2="443" y2="304" stroke="#ffd76a" stroke-width="3"/>
    <circle cx="443" cy="304" r="4" fill="#ffd76a"/>

    <text x="322" y="322" font-size="9" fill="#9c8a68" letter-spacing="1">GROWTH PROGRESS</text>
    <rect x="322" y="330" width="234" height="10" rx="5" fill="#1a1209"/>
    <rect x="322" y="330" width="170" height="10" rx="5" fill="#3f8f4a"/>
    <text x="322" y="354" font-size="9" fill="#c9b183">Day 6 of 8 — running on Charge, no Mana reservoir needed</text>
    <text x="322" y="378" font-size="9" fill="#9c8a68" letter-spacing="1">STATION STATS</text>
    <text x="322" y="394" font-size="8" fill="#e8dcc0">Base Success: 85% · Durability: 720/800</text>
  </g>

  <!-- right: essences + archive -->
  <g>
    <rect x="596" y="126" width="244" height="300" rx="6" fill="#241a10" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="610" y="146" font-size="9" fill="#9c8a68" letter-spacing="1">ESSENCE REQUIREMENT</text>
    <text x="610" y="162" font-size="8" fill="#e8dcc0">Life Essence</text>
    <rect x="610" y="166" width="210" height="7" rx="3.5" fill="#1a1209"/>
    <rect x="610" y="166" width="168" height="7" rx="3.5" fill="#3f8f4a"/>
    <text x="610" y="184" font-size="8" fill="#e8dcc0">Soul Essence, Chaos Essence (mutation)</text>
    <rect x="610" y="188" width="210" height="7" rx="3.5" fill="#1a1209"/>
    <rect x="610" y="188" width="90" height="7" rx="3.5" fill="#7a5fbf"/>

    <text x="610" y="216" font-size="9" fill="#9c8a68" letter-spacing="1">CREATURE ARCHIVE</text>
    <text x="610" y="234" font-size="9" fill="#c9b183">• Manticore (saved template)</text>
    <text x="610" y="250" font-size="9" fill="#c9b183">• Owlbear (saved template)</text>

    <text x="610" y="280" font-size="9" fill="#9c8a68" letter-spacing="1">CROSS-LINK</text>
    <text x="610" y="298" font-size="8" fill="#c9b183">Power system: devices.md &quot;Processing</text>
    <text x="610" y="312" font-size="8" fill="#c9b183">Vats&quot; — same object as this station,</text>
    <text x="610" y="326" font-size="8" fill="#c9b183">wired for independence from Mana grid</text>
  </g>

  <!-- power routing strip -->
  <g>
    <rect x="90" y="438" width="750" height="72" rx="6" fill="#1a1209" stroke="#8a6a3f" stroke-width="1.5"/>
    <text x="104" y="456" font-size="9" fill="#9c8a68" letter-spacing="1">POWER ROUTING (devices.md)</text>

    <!-- crystal capacitor -->
    <circle cx="140" cy="486" r="20" fill="url(#crystalGlow)" stroke="#c9a227" stroke-width="2"/>
    <text x="140" y="514" text-anchor="middle" font-size="8" fill="#c9b183">Crystal Capacitor</text>

    <!-- conduit line with inlay label -->
    <line x1="164" y1="486" x2="330" y2="486" stroke="#ffd76a" stroke-width="4" stroke-dasharray="10 4"/>
    <text x="247" y="478" text-anchor="middle" font-size="8" fill="#e8dcc0">Power Conduit — Mana-Infused Crystal Inlay</text>

    <!-- activation lever -->
    <rect x="330" y="472" width="34" height="28" rx="4" fill="#5a3a14" stroke="#c9a227"/>
    <text x="347" y="516" text-anchor="middle" font-size="8" fill="#c9b183">Lever</text>

    <line x1="364" y1="486" x2="443" y2="486" stroke="#ffd76a" stroke-width="4"/>
    <text x="443" y="514" text-anchor="middle" font-size="8" fill="#c9b183">to Vat ↑</text>

    <!-- charge gauge -->
    <text x="520" y="464" font-size="9" fill="#9c8a68" letter-spacing="1">CHARGE</text>
    <rect x="520" y="472" width="180" height="14" rx="7" fill="#1a1209" stroke="#8a6a3f"/>
    <rect x="520" y="472" width="128" height="14" rx="7" fill="#ffd76a"/>
    <text x="700" y="483" text-anchor="end" font-size="9" fill="#2a1c0f">356 / 500</text>
    <text x="520" y="504" font-size="8" fill="#c9b183">Fed by Crystal Beacon — no physical conduit needed past this point</text>
  </g>

  <text x="96" y="538" font-size="9" fill="#7a6a50">Reference mockup only — see devices.md &quot;Power Transmission&quot; (Line Inlay, Lever) and &quot;Processing Vats&quot; (Creature Vat).</text>
</svg>
